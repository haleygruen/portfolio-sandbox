<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Systems map option</title><desc id="desc">Three journey domains surround a central shared taxonomy, showing a connected enterprise system.</desc><rect width="1200" height="720" fill="#0d141b"/><text x="60" y="76" fill="#f2f0ec" font-family="Georgia,serif" font-size="36">A connected system of journeys</text><text x="62" y="112" fill="#9ca6aa" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">SYSTEMS MAP</text><g fill="none" stroke="#d9d0c2" stroke-width="3" opacity=".7"><path d="M335 260 Q500 290 600 350"/><path d="M865 260 Q700 290 600 350"/><path d="M600 470 Q480 510 300 520"/><path d="M600 470 Q720 510 900 520"/></g><circle cx="600" cy="385" r="138" fill="#d9d0c2" stroke="#f2f0ec" stroke-width="4"/><text x="600" y="370" text-anchor="middle" fill="#0d141b" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2">SHARED</text><text x="600" y="400" text-anchor="middle" fill="#0d141b" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2">TAXONOMY</text><g stroke="#18232b" stroke-width="4"><rect x="90" y="180" width="300" height="140" rx="70" fill="#f3c6ce"/><rect x="810" y="180" width="300" height="140" rx="70" fill="#b9dce5"/><rect x="450" y="540" width="300" height="100" rx="50" fill="#cbdba7"/></g><g fill="#18232b" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="1"><text x="240" y="245">SHOPPER + STORE</text><text x="960" y="245">BACK OF HOUSE</text><text x="600" y="598">COMMERCIAL LIFECYCLE</text></g></svg>