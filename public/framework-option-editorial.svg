<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Editorial storyboard option</title><desc id="desc">Three colored panels show shopper and store experience, back-of-house operations, and the commercial lifecycle connected by a shared taxonomy.</desc><rect width="1200" height="720" fill="#f3eee5"/><text x="60" y="76" fill="#18232b" font-family="Georgia,serif" font-size="36">Three domains, one shared language</text><text x="62" y="112" fill="#68737b" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">EDITORIAL STORYBOARD</text><g stroke="#18232b" stroke-width="4"><rect x="60" y="180" width="300" height="300" rx="8" fill="#f3c6ce"/><rect x="450" y="180" width="300" height="300" rx="8" fill="#b9dce5"/><rect x="840" y="180" width="300" height="300" rx="8" fill="#cbdba7"/></g><g fill="none" stroke="#18232b" stroke-width="7" stroke-linecap="round"><path d="M125 300h170M125 360h130M515 275h170M515 335h130M905 275h170M905 335h140"/><path d="M395 330h40M785 330h40"/></g><g fill="#18232b" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2"><text x="92" y="540">SHOPPER + STORE</text><text x="490" y="540">BACK OF HOUSE</text><text x="867" y="540">COMMERCIAL LIFECYCLE</text></g><path d="M170 625 C360 570 840 570 1030 625" fill="none" stroke="#18232b" stroke-width="6" stroke-linecap="round"/><path d="M450 612 C540 580 660 580 750 612" fill="none" stroke="#6b9b9e" stroke-width="20" stroke-linecap="round"/><text x="600" y="674" text-anchor="middle" fill="#18232b" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">SHARED TAXONOMY</text></svg>