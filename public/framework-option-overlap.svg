<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Overlapping operating domains</title><desc id="desc">Three overlapping circles represent the shopper and in-store experience, back-of-house operations, and business operations, with their shared taxonomy at the center.</desc><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity=".35"/></filter></defs><rect width="1200" height="720" fill="#08090d"/><text x="66" y="76" fill="#ffffff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Where operating lenses overlap</text><text x="68" y="112" fill="#a9a6b8" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">CONNECTED DOMAINS</text><g opacity=".9" filter="url(#shadow)" stroke="#ffffff" stroke-width="3"><circle cx="475" cy="300" r="190" fill="#a950dc" fill-opacity=".8"/><circle cx="725" cy="300" r="190" fill="#ff971e" fill-opacity=".8"/><circle cx="600" cy="475" r="190" fill="#0cbac8" fill-opacity=".8"/></g><circle cx="600" cy="360" r="72" fill="#244be8" stroke="#ffffff" stroke-width="4"/><text x="600" y="352" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="15" font-weight="700">SHARED</text><text x="600" y="376" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="15" font-weight="700">TAXONOMY</text><g fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle"><text x="390" y="240">SHOPPER +</text><text x="390" y="264">IN-STORE</text><text x="390" y="288">EXPERIENCE</text><text x="810" y="240">BACK-OF-HOUSE</text><text x="810" y="264">OPERATIONS</text><text x="600" y="570">BUSINESS OPERATIONS</text></g><g fill="#f35a9a"><circle cx="260" cy="185" r="7"/><circle cx="940" cy="185" r="7"/></g><g fill="#ffc400"><circle cx="600" cy="650" r="7"/></g></svg>