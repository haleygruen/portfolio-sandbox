<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Hierarchical journey map</title><desc id="desc">A hierarchy connects a shared taxonomy to three operating domains and representative journey examples, with one traceable path highlighted.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#1a1b22" flood-opacity=".16"/></filter></defs><rect width="1200" height="800" fill="#f6f7f8"/><text x="600" y="48" text-anchor="middle" fill="#202127" font-family="Arial,sans-serif" font-size="27" font-weight="700">A traceable view of the experience</text><g stroke="#25262b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M600 164v42M600 292v40M210 332H990M210 332v42M600 332v42M990 332v42M210 484v38M600 484v38M990 484v38"/><path d="M600 292v188" stroke="#e21b7a" stroke-width="6"/><path d="M600 522v28" stroke="#e21b7a" stroke-width="6"/></g><g filter="url(#shadow)"><rect x="470" y="78" width="260" height="86" rx="8" fill="#ffffff" stroke="#d7d8dc"/><rect x="495" y="91" width="115" height="24" rx="12" fill="#f3cde1"/><text x="552" y="108" text-anchor="middle" fill="#4d1737" font-family="Arial,sans-serif" font-size="13" font-weight="700">SHARED TAXONOMY</text><text x="600" y="143" text-anchor="middle" fill="#202127" font-family="Arial,sans-serif" font-size="19" font-weight="700">Journey management practice</text></g><g filter="url(#shadow)"><rect x="70" y="206" width="280" height="86" rx="8" fill="#ffffff" stroke="#d7d8dc"/><rect x="95" y="219" width="84" height="24" rx="12" fill="#c8ead9"/><text x="137" y="236" text-anchor="middle" fill="#174d38" font-family="Arial,sans-serif" font-size="13" font-weight="700">L1 DOMAIN</text><text x="210" y="270" text-anchor="middle" fill="#202127" font-family="Arial,sans-serif" font-size="18" font-weight="700">Shopper + in-store</text><rect x="460" y="206" width="280" height="86" rx="8" fill="#e21b7a" stroke="#e21b7a"/><rect x="485" y="219" width="84" height="24" rx="12" fill="#f7a9ce"/><text x="527" y="236" text-anchor="middle" fill="#65123e" font-family="Arial,sans-serif" font-size="13" font-weight="700">L1 DOMAIN</text><text x="600" y="270" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Back-of-house operations</text><rect x="850" y="206" width="280" height="86" rx="8" fill="#ffffff" stroke="#d7d8dc"/><rect x="875" y="219" width="84" height="24" rx="12" fill="#f5e2a6"/><text x="917" y="236" text-anchor="middle" fill="#624e13" font-family="Arial,sans-serif" font-size="13" font-weight="700">L1 DOMAIN</text><text x="990" y="270" text-anchor="middle" fill="#202127" font-family="Arial,sans-serif" font-size="18" font-weight="700">Business operations</text></g><g filter="url(#shadow)" fill="#ffffff" stroke="#d7d8dc"><rect x="70" y="374" width="280" height="110" rx="8"/><rect x="460" y="374" width="280" height="110" rx="8" stroke="#e21b7a" stroke-width="3"/><rect x="850" y="374" width="280" height="110" rx="8"/></g><g font-family="Arial,sans-serif"><text x="95" y="414" fill="#202127" font-size="17" font-weight="700">Store visit and service</text><text x="95" y="444" fill="#70727a" font-size="15">A journey customers can feel</text><rect x="95" y="455" width="76" height="20" rx="10" fill="#c8ead9"/><text x="133" y="469" text-anchor="middle" fill="#174d38" font-size="12" font-weight="700">L2 JOURNEY</text><text x="485" y="414" fill="#202127" font-size="17" font-weight="700">Research to decision</text><text x="485" y="444" fill="#70727a" font-size="15">Evidence that can travel</text><rect x="485" y="455" width="76" height="20" rx="10" fill="#f3cde1"/><text x="523" y="469" text-anchor="middle" fill="#65123e" font-size="12" font-weight="700">L2 JOURNEY</text><text x="875" y="414" fill="#202127" font-size="17" font-weight="700">Deal to support</text><text x="875" y="444" fill="#70727a" font-size="15">A relationship that continues</text><rect x="875" y="455" width="76" height="20" rx="10" fill="#f5e2a6"/><text x="913" y="469" text-anchor="middle" fill="#624e13" font-size="12" font-weight="700">L2 JOURNEY</text></g><g filter="url(#shadow)" fill="#ffffff" stroke="#d7d8dc"><rect x="400" y="550" width="400" height="105" rx="8" stroke="#e21b7a" stroke-width="3"/></g><g font-family="Arial,sans-serif"><text x="430" y="590" fill="#202127" font-size="18" font-weight="700">Connected evidence and action</text><text x="430" y="620" fill="#70727a" font-size="15">Insight  →  opportunity  →  solution</text><rect x="430" y="632" width="91" height="20" rx="10" fill="#c8ead9"/><text x="475" y="646" text-anchor="middle" fill="#174d38" font-size="12" font-weight="700">L3 OUTCOME</text></g><text x="600" y="730" text-anchor="middle" fill="#70727a" font-family="Arial,sans-serif" font-size="15">The hierarchy makes the path from shared language to useful action visible.</text></svg>