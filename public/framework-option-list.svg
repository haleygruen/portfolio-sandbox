<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Numbered operating lenses</title><desc id="desc">A polished dark numbered list explains the three journey domains and the shared taxonomy that connects them.</desc><rect width="1200" height="720" fill="#08090d"/><text x="68" y="76" fill="#ffffff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Three places the journey has to work</text><text x="70" y="112" fill="#a9a6b8" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">OPERATING LENSES</text><g fill="none" stroke="#303443" stroke-width="3"><ellipse cx="178" cy="220" rx="130" ry="58"/><ellipse cx="178" cy="365" rx="130" ry="58"/><ellipse cx="178" cy="510" rx="130" ry="58"/></g><g fill="#ffffff" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle"><text x="178" y="230">01</text><text x="178" y="375">02</text><text x="178" y="520">03</text></g><g stroke-linecap="round"><path d="M308 220H455" stroke="#a950dc" stroke-width="6"/><path d="M308 365H455" stroke="#ff971e" stroke-width="6"/><path d="M308 510H455" stroke="#0cbac8" stroke-width="6"/></g><g font-family="Arial,sans-serif"><text x="490" y="210" fill="#ffffff" font-size="22" font-weight="700">SHOPPER + IN-STORE EXPERIENCE</text><text x="490" y="244" fill="#a9a6b8" font-size="17">Shopping, dining, service, and the moments customers feel.</text><text x="490" y="355" fill="#ffffff" font-size="22" font-weight="700">BACK-OF-HOUSE OPERATIONS</text><text x="490" y="389" fill="#a9a6b8" font-size="17">Inventory, loading, store analytics, and daily operations.</text><text x="490" y="500" fill="#ffffff" font-size="22" font-weight="700">BUSINESS OPERATIONS</text><text x="490" y="534" fill="#a9a6b8" font-size="17">Deals, customer support, product quality, and improvement.</text></g><path d="M1000 170v410" stroke="#5e75ff" stroke-width="18" stroke-linecap="round"/><text x="1055" y="375" transform="rotate(90 1055 375)" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">SHARED TAXONOMY</text></svg>