<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Radial journey system</title><desc id="desc">A polished radial diagram connects a shared taxonomy to shopper and in-store experience, back-of-house operations, and business operations.</desc><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000000" flood-opacity=".35"/></filter><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#149eea"/><stop offset="1" stop-color="#244be8"/></linearGradient></defs><rect width="1200" height="720" fill="#08090d"/><text x="66" y="76" fill="#ffffff" font-family="Arial,sans-serif" font-size="36" font-weight="700">One taxonomy, three operating lenses</text><text x="68" y="112" fill="#a9a6b8" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">RADIAL SYSTEM MAP</text><g fill="none" stroke="#4d5366" stroke-width="3"><path d="M600 360C470 280 350 220 236 190"/><path d="M600 360C730 280 850 220 964 190"/><path d="M600 360C600 450 600 510 600 570"/></g><circle cx="600" cy="360" r="140" fill="#151722" stroke="#5e75ff" stroke-width="5" filter="url(#shadow)"/><circle cx="600" cy="360" r="105" fill="url(#blue)" opacity=".94"/><text x="600" y="348" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">SHARED</text><text x="600" y="378" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">TAXONOMY</text><g filter="url(#shadow)" stroke="#ffffff" stroke-width="3"><circle cx="190" cy="170" r="100" fill="#a950dc"/><circle cx="1010" cy="170" r="100" fill="#ff971e"/><circle cx="600" cy="590" r="100" fill="#0cbac8"/></g><g fill="#ffffff" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><text x="190" y="164">SHOPPER +</text><text x="190" y="188">IN-STORE</text><text x="190" y="212">EXPERIENCE</text><text x="1010" y="164">BACK-OF-HOUSE</text><text x="1010" y="188">OPERATIONS</text><text x="600" y="584">BUSINESS</text><text x="600" y="608">OPERATIONS</text></g><g fill="#f35a9a"><circle cx="156" cy="125" r="6"/><circle cx="1039" cy="125" r="6"/></g><g fill="#ffc400"><circle cx="600" cy="530" r="6"/></g></svg>